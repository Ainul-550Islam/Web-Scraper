global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: harvest
    # Created with mode 0600 by prometheus-entrypoint.sh, owned by the
    # runtime user. No literal $VAR is ever sent as a bearer credential.
    authorization:
      credentials_file: /tmp/harvest-admin-token
    static_configs:
      - targets: ["harvest:9678"]
