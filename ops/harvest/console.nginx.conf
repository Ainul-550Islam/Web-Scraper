# Console nginx config for the docker-compose deployment.
# Same static policy as web/nginx.conf.example, with two deliberate deltas:
#   1. the /api proxy targets the `harvest` service name (compose network),
#      not 127.0.0.1 (which would be the console's own container);
#   2. the console image is built with VITE_API_BASE=/api so the SPA only
#      ever calls /api/* through here — engine tokens stay browser-side.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hash routing keeps client routes in the fragment: `/` uses the index
    # directive, while unknown file paths retain nginx's normal 404.
    location / {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location ~* \.(js|css|html)$ {
        expires off;
        add_header Cache-Control "no-cache";
        # Nginx stops inheriting parent-level add_header directives as soon
        # as this location declares Cache-Control, so repeat the security
        # headers here for the index and content-hashed static assets.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    location ^~ /api/ {
        proxy_pass http://harvest:9678/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
