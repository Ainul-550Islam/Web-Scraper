apiVersion: apps/v1
kind: Deployment
metadata:
  name: harvest-console
  namespace: harvest
  labels: { app: harvest-console }
spec:
  replicas: 2
  selector:
    matchLabels: { app: harvest-console }
  template:
    metadata:
      labels: { app: harvest-console }
    spec:
      containers:
        - name: console
          image: harvest-console:local # build with: docker build -t harvest-console:local web/
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /index.html, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 64Mi }
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          volumeMounts:
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: nginx-conf
          configMap: { name: harvest-console-nginx }
