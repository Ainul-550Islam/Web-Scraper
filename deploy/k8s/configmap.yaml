# Non-sensitive config only: the bearer token is never mounted anywhere the
# browser can read; the console keeps it in memory per docs/adr/0006.
apiVersion: v1
kind: ConfigMap
metadata:
  name: harvest-console-nginx
  namespace: harvest
data:
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      location / { try_files $uri =404; }
      location /api/ { proxy_pass http://harvest-engine:9678/; }
      add_header X-Content-Type-Options nosniff;
      add_header X-Frame-Options DENY;
    }
